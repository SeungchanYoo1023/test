<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{ margin: 0;}
        .sec{
            width: 100%;
            height: 500px;
            background-color: skyblue;
        }
        .sec:nth-child(odd){
            background-color: pink;
        }
    </style>
</head>
<body>
    <!-- 페이지 내부이동
         a 태그의 href 에 #이동할 요소의 id값 넣기 -->
    <div>
        <div>
            <a href="#sec1">menu1</a>
            <a href="#sec2">menu2</a>
            <a href="#sec3">menu3</a>
            <a href="#sec4">menu4</a>
        </div>
    </div>
    
    <div class="sec" id="sec1">sec1</div>
    <div class="sec" id="sec2">sec2</div>
    <div class="sec" id="sec3">sec3</div>
    <div class="sec" id="sec4">sec4</div>

    <div>안녕</div>

</body>
</html>
